model_name_or_path: models/minicpm5-2b-bf16
cuda_visible_devices: "0"
train_file: runs/latest_dataset_600/sft_train.jsonl
val_file: runs/latest_dataset_600/sft_val.jsonl
output_dir: runs/sft-minicpm5-2b
tensorboard_dir: runs/tb-logs/sft-minicpm5-2b

max_seq_length: 1024
max_completion_length: 64
bf16: true
gradient_checkpointing: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

num_train_epochs: 3
per_device_train_batch_size: 2
per_device_eval_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.08
weight_decay: 0.01
logging_steps: 2
eval_steps: 15
save_steps: 50
seed: 42
